# Deploys site/ to GitHub Pages via Actions (verbatim upload, no Jekyll).
# While the repository is private, Pages is unavailable on the free plan, so
# the workflow runs on manual dispatch only. On the day the repo goes public:
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. Add a push trigger here:
#        push:
#          branches: [main]
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
